[build-system]
requires = ["setuptools >= 64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eden-soma-retargeter"
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE", "licenses/**/*.txt"]
requires-python = ">=3.10"
dependencies = [
    "newton==1.0.0",
    "warp-lang==1.12.0",
    "typing_extensions==4.15.0",
    "pyglet==2.1.13",
    "numpy>=2.0,<3",
    "GitPython==3.1.46",
    "trimesh==4.11.3",
    "imgui-bundle==1.92.4",
    "usd-core==26.3",
    "scipy>=1.13,<2",
    "tqdm==4.67.3",
]
readme = "README.md"

[project.optional-dependencies]
# In-process SMPL/SMPL-H/SMPL-X -> SOMA fitting (soma_retargeter.retargeting).
# The core BVH -> CSV path and the soma-bvh-to-csv script work without these.
fit = [
    # >=0.2: 0.1.0's SOMALayer has no procedural-transform rig and so does not
    # accept enable_procedural_transforms, which the fit stage now passes.
    "py-soma-x>=0.2,<0.3",
    "smplx==0.1.28",
    "torch>=2.4",
    "chumpy>=0.70",
]

[project.scripts]
soma-bvh-to-csv = "soma_retargeter.app.bvh_to_csv_converter:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["soma_retargeter*"]

[tool.setuptools.package-data]
soma_retargeter = ["configs/**/*.json", "configs/**/*.bvh", "configs/**/*.usd"]

[tool.setuptools.dynamic]
version = { attr = "soma_retargeter.__version__" }

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
warp-lang = { index = "nvidia" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true
